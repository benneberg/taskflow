name: CI / Quality & Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Lint, Test & Compile
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Static Type Checking (tsc)
        run: npm run lint

      - name: Run Test Assertion Suite
        run: npm run test
        env:
          NODE_ENV: test

      - name: Build Production Bundle (Vite + esbuild)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify Distribution Artifacts
        run: |
          test -f dist/server.cjs || { echo "Missing dist/server.cjs"; exit 1; }
          test -f dist/index.html || { echo "Missing dist/index.html"; exit 1; }
          echo "Production artifacts successfully verified."
